<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" role="img" aria-label="Line drawing of the figure of justice holding a sword and balanced scales" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .ln { stroke-dasharray: 1; stroke-dashoffset: 1; animation: lnDraw 1.3s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes lnDraw { to { stroke-dashoffset: 0; } }
    .ln-sway { transform-box: view-box; transform-origin: 172px 80px; animation: lnSway 7s ease-in-out infinite; }
    @keyframes lnSway { 0%, 100% { transform: rotate(-2.4deg); } 50% { transform: rotate(2.4deg); } }
    @media (prefers-reduced-motion: reduce) {
      .ln { animation: none; stroke-dashoffset: 0; }
      .ln-sway { animation: none; }
    }
  </style>

  <!-- sword -->
  <path class="ln" pathLength="1" d="M58 14 L51 30 L65 30 Z" style="animation-delay:.50s"/>
  <path class="ln" pathLength="1" d="M58 30 V92" style="animation-delay:.56s"/>
  <path class="ln" pathLength="1" d="M43 92 H73" style="animation-delay:.62s"/>
  <path class="ln" pathLength="1" d="M58 92 V113" style="animation-delay:.68s"/>
  <circle class="ln" pathLength="1" cx="58" cy="117" r="3.6" style="animation-delay:.72s"/>

  <!-- head and blindfold -->
  <circle class="ln" pathLength="1" cx="120" cy="92" r="19" style="animation-delay:.05s"/>
  <path class="ln" pathLength="1" d="M101 87 C112 93 128 93 139 87" style="animation-delay:.16s"/>
  <path class="ln" pathLength="1" d="M112 110 L112 122" style="animation-delay:.24s"/>
  <path class="ln" pathLength="1" d="M128 110 L128 122" style="animation-delay:.28s"/>

  <!-- collar and robe -->
  <path class="ln" pathLength="1" d="M96 124 C106 133 134 133 144 124" style="animation-delay:.32s"/>
  <path class="ln" pathLength="1" d="M96 124 C88 152 84 182 84 210 C84 234 87 248 90 258 L150 258 C153 248 156 234 156 210 C156 182 152 152 144 124" style="animation-delay:.38s"/>
  <path class="ln" pathLength="1" d="M110 144 C106 180 104 216 106 250" style="animation-delay:.52s"/>
  <path class="ln" pathLength="1" d="M130 144 C134 180 136 216 134 250" style="animation-delay:.56s"/>

  <!-- plinth -->
  <path class="ln" pathLength="1" d="M84 258 H156 L162 268 H78 Z" style="animation-delay:.70s"/>
  <path class="ln" pathLength="1" d="M78 268 H162 V282 H78 Z" style="animation-delay:.76s"/>
  <path class="ln" pathLength="1" d="M89 268 V282" style="animation-delay:.82s"/>
  <path class="ln" pathLength="1" d="M151 268 V282" style="animation-delay:.86s"/>
  <path class="ln" pathLength="1" d="M70 282 H170" style="animation-delay:.90s"/>

  <!-- sword arm -->
  <path class="ln" pathLength="1" d="M97 139 C81 137 68 128 60 118" style="animation-delay:.94s"/>
  <circle class="ln" pathLength="1" cx="59" cy="116" r="5" style="animation-delay:.98s"/>

  <!-- scale arm and stem -->
  <path class="ln" pathLength="1" d="M147 140 C160 140 168 136 171 132" style="animation-delay:1.02s"/>
  <circle class="ln" pathLength="1" cx="172" cy="130" r="5" style="animation-delay:1.06s"/>
  <path class="ln" pathLength="1" d="M172 125 V86" style="animation-delay:1.10s"/>
  <path class="ln" pathLength="1" d="M172 75.5 V86" style="animation-delay:1.14s"/>
  <circle class="ln" pathLength="1" cx="172" cy="72" r="3.6" style="animation-delay:1.18s"/>

  <!-- balance beam and pans -->
  <g class="ln-sway">
    <path class="ln" pathLength="1" d="M136 86 H208" style="animation-delay:1.26s"/>
    <path class="ln" pathLength="1" d="M136 86 V100" style="animation-delay:1.30s"/>
    <path class="ln" pathLength="1" d="M208 86 V100" style="animation-delay:1.34s"/>
    <path class="ln" pathLength="1" d="M120 100 H152 Q136 125 120 100 Z" style="animation-delay:1.38s"/>
    <path class="ln" pathLength="1" d="M192 100 H224 Q208 125 192 100 Z" style="animation-delay:1.42s"/>
  </g>
</svg>
